name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot && chmod +x godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q templates.tpz -d tpl
          DEST="$HOME/.local/share/godot/export_templates/$(cat tpl/templates/version.txt)"
          mkdir -p "$DEST" && cp tpl/templates/windows_release_x86_64.exe tpl/templates/windows_debug_x86_64.exe tpl/templates/version.txt "$DEST/"
          rm -rf tpl templates.tpz godot.zip

      - name: Install NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis

      - name: Build
        run: GODOT="$PWD/godot" tools/build.sh

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/windows/Driver.exe "build/Driver-portable.exe"
          gh release create "${GITHUB_REF_NAME}" build/Driver-Setup.exe build/Driver-portable.exe \
            --title "Driver ${GITHUB_REF_NAME}" --generate-notes || \
          gh release upload "${GITHUB_REF_NAME}" build/Driver-Setup.exe build/Driver-portable.exe --clobber
